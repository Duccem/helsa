name: Test workflow

on:
  pull_request:
    types: [opened, reopened]
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run test
        run: echo "Test completed"
